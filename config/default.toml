# CPU-only embedding server (PHASE0_PLAN 3.5, bench/profiles/embedding.toml). Runs as its own
# supervised server next to the chat model; inputs are capped at 1024 tokens.
[model.profiles.embedding]
runtime = "llama-stock"
model = 'F:\Nebula\models\embedding\Qwen3-Embedding-0.6B-Q8_0.gguf'
ctx = 1024
kv_type = "f16"
embedding = true
flags = [
    "--embedding",
    "--pooling", "last",
    "--device", "none",
    "-ngl", "0",
    "-t", "8",
    "-np", "1",
    "-b", "1024",
    "-ub", "1024",
    "-fa", "on",
    "-lv", "4",
    "--cors-origins", "http://nebula.invalid",
    "--no-cors-credentials",
]
