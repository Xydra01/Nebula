# Nebula daemon defaults, embedded in the binaries by nebula-config. Local changes go in
# F:\Nebula\config\nebula.toml (or the file named by NEBULA_CONFIG), which is merged over this.
# Model profiles come from ADR-004 and ADR-006; `standard` matches bench/profiles/pq2mtp.toml.

[paths]
data_root = 'F:\Nebula'
logs = 'F:\Nebula\logs'
state = 'F:\Nebula\state'
config = 'F:\Nebula\config'
archive = 'D:\NebulaCold\logs-archive'
backups_local = 'D:\NebulaCold\backups-local'

[backup]
rclone = "rclone"
rclone_config = 'F:\Nebula\config\rclone.conf'
auth_remote = "gdrive:"
remote = "gdrive-crypt:"
# The Google app is unpublished (Testing), so its sign-in expires 7 days after
# `nebula backup reauth`. Set to 0 once it is published or for a key-based remote.
token_lifetime_days = 7
token_warn_days = 2
# Retention approved 2026-10-04 (PHASE0_PLAN 7.1).
keep_recent = 8
keep_daily = 14
keep_weekly = 8
keep_monthly = 6
local_keep_days = 7
# Deleting more than this asks first (Phase 0 delete rule).
max_delete_files = 500
max_delete_mib = 1024

[telemetry]
filter = "info"

[daemon]
pipe_name = "nebula"
# Profile loaded at startup; "" starts with no model.
load_on_start = "standard"
# CPU embedding server; "" disables it.
embedding_profile = "embedding"
# Credential Manager targets whose values are masked in every log and blob.
secrets = ["nebula/github_bot_token", "nebula/cursor_api_key", "nebula/rclone_config_pass"]

[resources]
sample_interval_ms = 2000
log_interval_s = 30
# Free commit charge kept on top of a profile's estimate before it may load.
commit_margin_mib = 1024
vram_headroom_warn_mib = 1024
# Hot logs on F: (7 days) and the archive cap on D:.
log_budget_gb = 2
archive_cap_gb = 8
# The failing drive that must not come back into use (PHASE0_PLAN 3.1).
retired_drive = "C:"

# Disk guard (PHASE0_PLAN 3.2). Phase 0 reports these; enforcement comes with tasks in Phase 1.
[[resources.volumes]]
mount = 'F:\'
warn_gb = 30
block_gb = 20
pause_gb = 12

[[resources.volumes]]
mount = 'D:\'
warn_gb = 50
block_gb = 25

[model]
default_profile = "standard"

[model.runtimes]
llama-prism = 'F:\Nebula\runtime\llama-prism\b10743-adfffbe\llama-server.exe'
llama-stock = 'F:\Nebula\runtime\llama-stock\b11342\llama-server.exe'

# PQ2_0 + MTP head, q4_0 KV at 32K (ADR-006).
[model.profiles.standard]
runtime = "llama-prism"
model = 'F:\Nebula\models\bonsai2-27b-mtp\Ternary-Bonsai-2-27B-PQ2_0-MTP-Q8_0.gguf'
ctx = 32768
kv_type = "q4_0"
# Measured 2026-10-04: on WDDM, llama-server commits about as much as it uses in VRAM.
commit_estimate_mib = 10700
flags = [
    "-ngl", "99",
    "-fa", "on",
    "-np", "1",
    "--jinja",
    "--reasoning", "auto",
    "--ctx-checkpoints", "32",
    "--cache-ram", "4096",
    "--cache-idle-slots",
    "--spec-type", "draft-mtp",
    "--spec-draft-n-max", "2",
    # The default allows every origin, so any web page could drive the local server.
    "--cors-origins", "http://nebula.invalid",
    "--no-cors-credentials",
    "-lv", "4",
]

[model.profiles.standard.sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.05
presence_penalty = 0.0
repeat_penalty = 1.0

[model.profiles.standard.sampling.instruct]
temperature = 0.7
top_p = 0.80
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0

# PTQ1_0, q4_0 KV + bias at 128K (ADR-004). Expect ~3 min to ingest 120K tokens cold.
[model.profiles.long]
runtime = "llama-prism"
model = 'F:\Nebula\models\bonsai2-27b\Ternary-Bonsai-2-27B-PTQ1_0.gguf'
ctx = 131072
kv_type = "q4_0"
kv_bias = 'F:\Nebula\models\bonsai2-27b\Ternary-Bonsai-2-27B-PTQ1_0-kv-bias.gguf'
# Not measured; 10.2 GB VRAM (ADR-004) plus the same margin as `standard`.
commit_estimate_mib = 10700
flags = [
    "-ngl", "99",
    "-fa", "on",
    "-np", "1",
    "--jinja",
    "--reasoning", "auto",
    "--ctx-checkpoints", "32",
    "--cache-ram", "4096",
    "--cache-idle-slots",
    "--cors-origins", "http://nebula.invalid",
    "--no-cors-credentials",
    "-lv", "4",
]

[model.profiles.long.sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.05
presence_penalty = 0.0
repeat_penalty = 1.0

[model.profiles.long.sampling.instruct]
temperature = 0.7
top_p = 0.80
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0

# PTQ1_0, q4_0 KV + bias at 16K, for contested VRAM (ADR-004).
[model.profiles.lean]
runtime = "llama-prism"
model = 'F:\Nebula\models\bonsai2-27b\Ternary-Bonsai-2-27B-PTQ1_0.gguf'
ctx = 16384
kv_type = "q4_0"
kv_bias = 'F:\Nebula\models\bonsai2-27b\Ternary-Bonsai-2-27B-PTQ1_0-kv-bias.gguf'
# Not measured; below the 7.97 GB of q4_0 at 32K (ADR-004), rounded up.
commit_estimate_mib = 8500
flags = [
    "-ngl", "99",
    "-fa", "on",
    "-np", "1",
    "--jinja",
    "--reasoning", "auto",
    "--ctx-checkpoints", "32",
    "--cache-ram", "4096",
    "--cache-idle-slots",
    "--cors-origins", "http://nebula.invalid",
    "--no-cors-credentials",
    "-lv", "4",
]

[model.profiles.lean.sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.05
presence_penalty = 0.0
repeat_penalty = 1.0

[model.profiles.lean.sampling.instruct]
temperature = 0.7
top_p = 0.80
top_k = 20
min_p = 0.0
presence_penalty = 1.5
repeat_penalty = 1.0

# CPU-only embedding server (PHASE0_PLAN 3.5, bench/profiles/embedding.toml). Runs as its own
# supervised server next to the chat model; inputs are capped at 1024 tokens.
[model.profiles.embedding]
runtime = "llama-stock"
model = 'F:\Nebula\models\embedding\Qwen3-Embedding-0.6B-Q8_0.gguf'
ctx = 1024
kv_type = "f16"
embedding = true
# 1.2-1.8 GB measured (PHASE0_PLAN 3.5), rounded up.
commit_estimate_mib = 2400
flags = [
    "--embedding",
    "--pooling", "last",
    "--device", "none",
    "-ngl", "0",
    "-t", "8",
    "-np", "1",
    "-b", "1024",
    "-ub", "1024",
    "-fa", "on",
    "-lv", "4",
    "--cors-origins", "http://nebula.invalid",
    "--no-cors-credentials",
]

# MCP tool servers (ADR-002, Phase 1). Each entry is a stdio MCP server the daemon launches in
# a Job Object and calls tools on. Empty by default; add servers in the local override
# (F:\Nebula\config\nebula.toml). Example:
#
#   [tools.servers.filesystem]
#   command = 'F:\Nebula\tools\mcp-filesystem.exe'
#   args = ["--root", 'F:\Nebula\worktrees']
#   call_timeout_ms = 30000
#   max_output_bytes = 1048576
#   env = [["RUST_LOG", "info"]]
[tools]
