kv_type = "q4_0"
kv_bias = 'F:\Nebula\models\bonsai2-27b\Ternary-Bonsai-2-27B-PTQ1_0-kv-bias.gguf'
flags = [
    "-ngl", "99",
    "-fa", "on",
    "-np", "1",
    "--jinja",
    "--reasoning", "auto",
    "--ctx-checkpoints", "32",
    "--cache-ram", "4096",
    "--cache-idle-slots",
    "--cors-origins", "http://nebula.invalid",
    "--no-cors-credentials",
    "-lv", "4",
]

[model.profiles.long.sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 20
