[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/Xydra01/Nebula"
publish = false

[workspace.dependencies]
nebula-backup = { path = "crates/nebula-backup" }
nebula-config = { path = "crates/nebula-config" }
nebula-daemon = { path = "crates/nebula-daemon" }
nebula-model = { path = "crates/nebula-model" }
nebula-proto = { path = "crates/nebula-proto" }
nebula-resources = { path = "crates/nebula-resources" }
nebula-telemetry = { path = "crates/nebula-telemetry" }
nebula-tools = { path = "crates/nebula-tools" }

anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
eventsource-stream = "0.2.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hex = "0.4.3"
jsonschema = { version = "0.33.0", default-features = false }
nvml-wrapper = "0.13.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
tokio-util = "0.7.19"
toml = "1.1.6"
windows = "0.62.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.2", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "env-filter"] }
ulid = { version = "3.0.0", features = ["serde"] }
zstd = "0.14.0"

axum = "0.8.9"
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"

# Model hashing (GBs) is unbearably slow unoptimized.
[profile.dev.package.sha2]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
# A pedantic subset: the lints that catch real mistakes without forcing churn.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
