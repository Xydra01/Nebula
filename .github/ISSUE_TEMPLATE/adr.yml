name: ADR proposal
description: Propose an architecture decision record
title: "ADR: "
labels: ["adr"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: The forces at play and the problem to decide.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
      description: Each option with its pros and cons.
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: What becomes easier or harder, and which existing ADRs this supersedes.
