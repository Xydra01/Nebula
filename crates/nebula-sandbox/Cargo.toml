[package]
name = "nebula-sandbox"
description = "Permission-tier engine and command classifier: the data-driven policy that assigns a tier and approval requirement to every command (protected set)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
## Exposes the test-only `Approval::new()` constructor to dependent crates' test builds.
## Enabled by `nebula-tools` as a dev-dependency so the issue #27 `shell.run` tests compile
## unchanged (Requirement 8.6). It must NOT be enabled in a production build: the constructor it
## unlocks bypasses the grant path and would otherwise undermine approval unforgeability (Req 5.5).
test-util = []

[dependencies]
serde = { workspace = true }
thiserror.workspace = true
# The `worktree` module shells out to the `git` CLI asynchronously, serializes creation behind
# per-repository async locks, and measures a worktree tree (async `fs`) for the delete-limit gate,
# so it needs the fs/process/sync/time/macros feature set (the module itself is wired by the
# git-worktree-per-task feature; see `src/worktree/mod.rs`). The issue #30 `task_job` memory-limit
# pump runs on a blocking task (`rt` for `spawn_blocking`); `rt` is a thin, runtime-agnostic
# addition the daemon already provides.
tokio = { workspace = true, features = ["fs", "process", "sync", "time", "macros", "rt"] }
toml.workspace = true
tracing.workspace = true

# The one audited `unsafe` Win32 Job Object surface (issue #30) lives in `src/job.rs`. It owns the
# kill-on-close job FFI, the IO-completion-port notification pump (for memory-limit reasons), and
# the suspended-spawn plumbing that assigns a child to its task's job before it can run. The
# `nebula-model` and `nebula-tools` launchers consume this one surface instead of each keeping a
# duplicate copy. Windows-only; see `src/job.rs`.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# Tests drive the async `worktree` helpers via `#[tokio::test]`, which needs a runtime; the library
# itself only needs process/sync/time/macros (see the `[dependencies]` tokio entry). The runtime
# feature is scoped to the dev build so production never pulls it in.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
