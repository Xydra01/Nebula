[package]
name = "nebula-sandbox"
description = "Permission-tier engine and command classifier: the data-driven policy that assigns a tier and approval requirement to every command (protected set)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
## Exposes the test-only `Approval::new()` constructor to dependent crates' test builds.
## Enabled by `nebula-tools` as a dev-dependency so the issue #27 `shell.run` tests compile
## unchanged (Requirement 8.6). It must NOT be enabled in a production build: the constructor it
## unlocks bypasses the grant path and would otherwise undermine approval unforgeability (Req 5.5).
test-util = []

[dependencies]
serde = { workspace = true }
thiserror.workspace = true
# The `worktree` module shells out to the `git` CLI asynchronously, serializes creation behind
# per-repository async locks, and measures a worktree tree (async `fs`) for the delete-limit gate,
# so it needs the fs/process/sync/time/macros feature set (the module itself is wired by the
# git-worktree-per-task feature; see `src/worktree/mod.rs`).
tokio = { workspace = true, features = ["fs", "process", "sync", "time", "macros"] }
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# Tests drive the async `worktree` helpers via `#[tokio::test]`, which needs a runtime; the library
# itself only needs process/sync/time/macros (see the `[dependencies]` tokio entry). The runtime
# feature is scoped to the dev build so production never pulls it in.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
