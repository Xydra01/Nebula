[package]
name = "nebula-resources"
description = "GPU, memory and disk sampling, disk guard, load preflight and local doctor checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nebula-config.workspace = true
nebula-model.workspace = true
nebula-proto.workspace = true
nebula-telemetry.workspace = true
nvml-wrapper.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Performance", "Win32_System_Registry"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros"] }

[lints]
workspace = true
