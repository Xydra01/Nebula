[package]
name = "nebula-tools"
description = "MCP tool host: launches stdio tool servers in Job Objects and calls their tools through one boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
## An in-process fake stdio MCP server and launcher in `nebula_tools::testing`.
test-support = []

[dependencies]
async-trait.workspace = true
jsonschema.workspace = true
nebula-proto.workspace = true
nebula-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "process", "io-util"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
nebula-tools = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
