# Fallback candidate, round 2 (MoE, experts in system RAM). Sampling from the Gemma 4 model card.
# Gemma 4's sliding-window layers make context checkpoints very large, so the cache is kept small.
name = "gemma4moe"
runtime = "llama-stock"
model = 'F:\Nebula\models\fallback-moe\gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf'
ctx = 32768
kv_type = "f16"
reasoning_style = "enable_thinking"
flags = ["--fit", "on", "--fit-target", "1536", "-fa", "on", "-np", "1", "--jinja",
         "--reasoning", "auto", "--ctx-checkpoints", "1", "--cache-ram", "0",
         "--cors-origins", "http://nebula.invalid", "--no-cors-credentials", "-lv", "4"]

[sampling.thinking]
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0

[sampling.instruct]
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
