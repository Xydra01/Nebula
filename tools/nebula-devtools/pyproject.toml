[project]
name = "nebula-devtools"
version = "0.1.0"
description = "Nebula's first external Python MCP tool server: build/test/lint adapters (issue #33)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
nebula-devtools = "nebula_devtools.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nebula_devtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end adapter tests that need a real toolchain (uv / cargo nextest); skip when absent",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Captured runner output used as parser fixtures is data; long lines there are faithful copies.
"tests/fixtures/*.py" = ["E501"]
